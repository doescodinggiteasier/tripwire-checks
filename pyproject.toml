[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire-checks"
version = "0.1.0"
description = "Make analysis pipelines prove their own checks can fail: preconditions, negative controls, exit-status receipts, calibration, shuffled-label controls, pre-registration hashes."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Wes Knipe"}]
requires-python = ">=3.9"
dependencies = []
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering", "Topic :: Software Development :: Testing"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tripwire = "tripwire_checks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
